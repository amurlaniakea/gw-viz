[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gw-analysis"
version = "0.3.0"
description = "Reproducible analysis of open gravitational-wave data from GWOSC (LIGO/Virgo/KAGRA)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Pedro Sordo Martínez"}]
keywords = ["gravitational-waves", "ligo", "virgo", "gwosc", "matched-filter", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "gwosc>=0.8",
  "numpy>=1.26",
  "scipy>=1.11",
  "h5py>=3.10",
  "matplotlib>=3.8",
  "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/amurlaniakea/gw-viz"
Issues = "https://github.com/amurlaniakea/gw-viz/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jupyter>=1.0"]

[project.scripts]
gw-analyze = "gw_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gw_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
